<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>待机姿态</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: rgba(255, 255, 255, 0.94);
    color: #4a3a5e;
    border-radius: 14px;
    padding: 12px 12px 10px;
    box-shadow: 0 10px 34px rgba(120, 80, 160, 0.28);
    overflow: hidden;
    display: flex; flex-direction: column;
  }
  .title {
    font-size: 13px; font-weight: 700; color: #7b5ea7;
    margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center;
  }
  .toolbar { display: flex; gap: 6px; }
  .toolbar button {
    font-size: 11px; padding: 3px 9px; border: 1px solid #e0d3f0;
    background: #faf6ff; color: #7b5ea7; border-radius: 8px; cursor: pointer;
  }
  .toolbar button:hover { background: #f0e6ff; }
  .list { flex: 1; overflow-y: auto; margin: 4px 0; }
  .row {
    display: flex; align-items: center; gap: 9px; padding: 6px 7px;
    border-radius: 9px; cursor: pointer; font-size: 13px; user-select: none;
  }
  .row:hover { background: #f3ecff; }
  .row input { width: 16px; height: 16px; accent-color: #9b6dd6; cursor: pointer; flex: none; }
  .done {
    margin-top: 4px; width: 100%; padding: 8px; border: none; border-radius: 10px;
    background: linear-gradient(135deg, #b98de0, #8f6ad0); color: #fff;
    font-size: 13px; font-weight: 600; cursor: pointer;
  }
  .done:hover { filter: brightness(1.05); }
  .list::-webkit-scrollbar { width: 6px; }
  .list::-webkit-scrollbar-thumb { background: #d9c7f0; border-radius: 3px; }
</style>
</head>
<body>
  <div class="title">
    <span>待机姿态（可多选）</span>
    <span class="toolbar">
      <button id="selAll">全选</button>
      <button id="selNone">清空</button>
    </span>
  </div>
  <div class="list" id="list"></div>
  <button class="done" id="done">完成</button>
  <script src="js/idle-pose-picker.js"></script>
</body>
</html>
